<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Tech Store</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="display: flex; justify-content: center; align-items: center; height: 100vh;">

    <div style="background: white; padding: 40px 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 360px; text-align: center;">
        <div style="margin-bottom: 20px;">
            <h1 style="font-size: 1.4rem; color: #1f2937; font-weight: 800;">Tech & Hardware Store</h1>
            <p style="color: #6b7280; font-size: 0.85rem; margin-top: 4px;">Faça login na sua conta</p>
        </div>

        {% if erro %}
            <div style="background: #fee2e2; color: #dc2626; padding: 10px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 15px; font-weight: 600;">{{ erro }}</div>
        {% endif %}

        <form action="/login" method="POST" style="display: flex; flex-direction: column; gap: 14px;">
            <input type="email" name="email" placeholder="Seu e-mail" required style="padding: 12px; border: 2px solid #e5e7eb; border-radius: 8px; outline: none;">
            <input type="password" name="senha" placeholder="Sua senha" required style="padding: 12px; border: 2px solid #e5e7eb; border-radius: 8px; outline: none;">
            <button type="submit" class="btn-comprar-direto" style="padding: 12px; border-radius: 8px; font-size: 1rem;">Entrar</button>
        </form>

        <p style="margin-top: 15px; font-size: 0.9rem;">Não tem uma conta? <a href="/registro" style="color: #2563eb; font-weight: bold;">Cadastre-se</a></p>
        <p style="margin-top: 10px; font-size: 0.9rem;"><a href="/" style="color: #4b5563; text-decoration: none;">← Voltar para a Loja</a></p>
    </div>
</body>
</html>
